<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!-- Gateway mark: hexagonal stations wired to circular hubs. Solid emerald
       ground so the mark stays legible at 16px in a browser tab, where a
       transparent background would drop it onto whatever the tab strip is. -->
  <rect width="40" height="40" rx="8" fill="#046A38"/>
  <g stroke="#ffffff" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 13v14M31 13v14" opacity="0.45"/>
    <path d="M9 13 15 26 20 10 25 26 31 13"/>
  </g>
  <g fill="#ffffff">
    <circle cx="9" cy="13" r="2.9"/>
    <circle cx="31" cy="13" r="2.9"/>
    <circle cx="9" cy="27" r="2.9"/>
    <circle cx="31" cy="27" r="2.9"/>
    <circle cx="20" cy="10" r="2.3"/>
    <circle cx="20" cy="20" r="3.4"/>
  </g>
</svg>
